name: Auto-update

# Fully automatic release pipeline, once a day:
#   new Eventra package on npm -> bump all pins -> run tests -> update docs/CHANGELOG/VERSIONS
#   -> commit + tag vX.Y.Z -> GitHub Release (release.yml).
# If tests fail nothing is committed and an issue is opened instead.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      simulate_from:
        description: "Dry run: pretend the repo still pins the packages of this tag (e.g. v1.2.0) so the pipeline finds real newer versions. Nothing is committed, tagged or released."
        required: false
        default: ""
      dry_run:
        description: "Dry run: run everything but do not commit, tag or release (a report is written to the job summary)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIMULATE_FROM: ${{ inputs.simulate_from }}
      DRY_RUN: ${{ (inputs.dry_run || inputs.simulate_from != '') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Simulate an older state (dry run only)
        if: env.SIMULATE_FROM != ''
        run: node tools/auto-update.mjs simulate "$SIMULATE_FROM"

      - name: Check npm for new versions
        id: check
        run: node tools/auto-update.mjs check

      - name: Bump pins
        if: steps.check.outputs.changed == 'true'
        id: apply
        run: node tools/auto-update.mjs apply

      - name: Install
        if: steps.check.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Test
        if: steps.check.outputs.changed == 'true'
        run: |
          set -o pipefail
          pnpm test:cli     2>&1 | tee "$RUNNER_TEMP/cli.log"
          pnpm test:sdk     2>&1 | tee "$RUNNER_TEMP/sdk.log"
          pnpm verify:cli   2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Update docs, CHANGELOG, VERSIONS
        if: steps.check.outputs.changed == 'true'
        id: fin
        run: node tools/auto-update.mjs finalize "$RUNNER_TEMP/cli.log" "$RUNNER_TEMP/sdk.log" "$RUNNER_TEMP/verify.log"

      - name: Dry-run report (nothing is committed, tagged or released)
        if: steps.check.outputs.changed == 'true' && env.DRY_RUN == 'true'
        run: |
          v="${{ steps.fin.outputs.version }}"
          {
            echo "## Dry run: would release v$v"
            echo
            echo "Tag message: \`${{ steps.fin.outputs.tag_message }}\`"
            echo
            echo "### Changed files"
            echo '```'
            git diff --stat | tail -40
            echo '```'
            echo
            echo "### Release notes that would be published"
            echo
            bash tools/release-notes.sh "v$v"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag, push
        if: steps.check.outputs.changed == 'true' && env.DRY_RUN != 'true'
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v="${{ steps.fin.outputs.version }}"
          git add -A
          git commit -m "release v$v: update Eventra packages"
          git tag -a "v$v" -m "${{ steps.fin.outputs.tag_message }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}" --follow-tags
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Open an issue if the update failed
        if: failure() && steps.check.outputs.changed == 'true' && env.DRY_RUN != 'true'
        run: |
          title="Auto-update failed: $(node -e "console.log(JSON.parse(require('fs').readFileSync('.auto-update.json','utf8')).updates.map(u=>u.pkg.replace('@eventra_dev/','')+' '+u.to).join(', '))" 2>/dev/null || echo 'new Eventra versions')"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')" ]; then
            gh issue create --title "$title" --body "A newer Eventra package was found on npm but the test run failed, so nothing was committed or released.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This is either a regression in the new version or a needed change in the examples. The job retries daily."
          fi

  release:
    needs: update
    if: needs.update.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
