name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: CLI feature tests
        run: pnpm test:cli

      - name: SDK feature tests
        run: pnpm test:sdk

  verify-cli:
    # sync + check + expected-events across all 23 examples/fixtures (~1.5 min).
    # SDK smoke (next/nest/workerd dev servers) stays local: pnpm verify
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:cli
